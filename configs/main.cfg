[DEFAULT]

[paths.hf_home]
# To use the default HF home path, comment the following line
val = .cache/huggingface
mode = relative

[paths.output]
val = output
mode = relative

# For deploying on an HPC, and store the data on a dedicated partition,
# you can use for example:
# [paths.output]
# val = /lustre/fsn1/projects/rech/yfw/upp42qa/output
# mode = absolute

[paths.logs]
val = logs
mode = relative

[internet]
offline = false

# For deploying on an HPC, and store the data on a dedicated partition,
# you can use for example:
# [internet]
# offline = true
